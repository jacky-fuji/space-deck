name: Automated Data Pipeline

on:
  schedule:
    # Run every 6 hours (at the start of the 0th, 6th, 12th, and 18th hours UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub interface

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Needs explicit permissions to push to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history in case we need it for diffs
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml dateparser
          
      - name: Run Data Pipeline Updater
        run: |
          python scripts/update_pipeline.py
          
      - name: Check for Modifications
        id: check_changes
        run: |
          git status --porcelain
          if [[ $(git status --porcelain) ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/app/data/missions.json scripts/data/
          git commit -m "chore(data): auto-update launch schedules and states"
          git push
